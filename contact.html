<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030816">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/gh/Deep-Space-Research-Team/html6@prototype-v0.2.0/html6.js"></script>
  <script defer src="script.js"></script>
<title>Contact Us - Deep Space Research Team</title>
</head>
<body>
  <canvas id="stars-canvas" aria-hidden="true"></canvas>
  <div class="glow-orb" aria-hidden="true"></div>
  <nav class="fade-in">
    <div class="logo"><a href="index.html">DSRT</a></div>
    <div class="nav-links">
      <a href="index.html">Home</a><a href="project.html">Projects</a>
      <a href="about.html">About Us</a><a href="contact.html">Contact</a>
    </div>
  </nav>

  <main class="page-content fade-in">
    <div class="project-card scroll-reveal" style="background:transparent;border:none;box-shadow:none">
      <p class="about-text" style="margin-bottom:2.5rem">Whether you're looking to collaborate on API development, contribute to Project Aegis, or inquire about our research, transmit your message below.</p>
      <form class="contact-form" action="https://formspree.io/f/xppqakvl" method="POST">
        <input type="text" name="name" placeholder="Name" aria-label="Name" required>
        <input type="email" name="email" placeholder="Email Address" aria-label="Email address" required>
        <input type="text" name="subject" placeholder="Subject" aria-label="Subject" required>
        <textarea name="message" rows="6" placeholder="Enter your message here..." aria-label="Message" required></textarea>
        <button type="submit" class="btn full-width-btn">Submit Message</button>
      </form>
    </div>
  </main>
  <footer class="scroll-reveal"><p>&copy; 2026 Deep Space Research Team. All rights reserved.</p></footer>
  <script type="text/psc" src="app.psc"></script>
</body>
</html>
